{% set name = "precious" %}
{% set version = "0.12.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/houseabsolute/precious/archive/refs/tags/v{{ version }}.tar.gz
  sha256: c3e10e136ded670bceb7cad93e95aad282355f728c5f5a1121af4ef1a7c50821

build:
  number: 0

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - precious --help

about:
  home: https://github.com/houseabsolute/precious
  license: Apache-2.0 or MIT
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
    - THIRDPARTY.yml
  summary: One code quality tool to rule them all
  dev_url: https://github.com/houseabsolute/precious

extra:
  recipe-maintainers:
    - brycekbargar
