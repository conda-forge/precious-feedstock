{% set name = "precious" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/houseabsolute/precious/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 2de1f5ed8d9013065577d51e6ec3762e6cb1db7aff20e0495f312416728e2e07

build:
  number: 0

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - precious --help

about:
  home: https://github.com/houseabsolute/precious
  license: Apache-2.0 or MIT
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
    - THIRDPARTY.yml
  summary: One code quality tool to rule them all
  dev_url: https://github.com/houseabsolute/precious

extra:
  recipe-maintainers:
    - brycekbargar
